<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000"><g clip-path="url(#SvgjsClipPath1106)"><rect width="1000" height="1000" fill="#190f5b"></rect><g transform="matrix(0.390625,0,0,0.390625,100,100)"><svg xmlns="http://www.w3.org/2000/svg" version="1.2" width="2048" height="2048" viewBox="-8.61447 -49.89214 525.07247 525.07247"><defs>
    <!-- Main metallic silver gradient -->
    <radialGradient id="silverGradient" cx="297.484" cy="420.727" r="515.274" fx="297.484" fy="420.727" gradientTransform="translate(.011)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="15%" stop-color="#f0f0f0"></stop>
      <stop offset="25%" stop-color="#e8e8e8"></stop>
      <stop offset="35%" stop-color="#d5d5d5"></stop>
      <stop offset="45%" stop-color="#c0c0c0"></stop>
      <stop offset="55%" stop-color="#a8a8a8"></stop>
      <stop offset="65%" stop-color="#909090"></stop>
      <stop offset="75%" stop-color="#b8b8b8"></stop>
      <stop offset="85%" stop-color="#d8d8d8"></stop>
      <stop offset="95%" stop-color="#f5f5f5"></stop>
      <stop offset="100%" stop-color="#ffffff"></stop>
    </radialGradient>
    
    <!-- Secondary highlight gradient for extra metallic effect -->
    <linearGradient id="metalHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"></stop>
      <stop offset="20%" stop-color="#f8f8f8" stop-opacity="0.2"></stop>
      <stop offset="40%" stop-color="#e0e0e0" stop-opacity="0.1"></stop>
      <stop offset="60%" stop-color="#c0c0c0" stop-opacity="0.05"></stop>
      <stop offset="80%" stop-color="#a0a0a0" stop-opacity="0.1"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"></stop>
    </linearGradient>
    
    <!-- Filter for metallic sheen effect -->
    <filter id="metallicSheen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"></feGaussianBlur>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="1.5" specularExponent="20" result="specOut" lighting-color="#ffffff">
        <fePointLight x="-100" y="-100" z="200"></fePointLight>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"></feComposite>
      <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"></feComposite>
    </filter>
    
    <!-- Drop shadow for depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"></feDropShadow>
    </filter>
